# Nginx reverse proxy for the OddsTrading VPS.
#
# Install to /etc/nginx/sites-available/oddstradingview.conf and symlink into
# sites-enabled. Certbot rewrites these blocks to add the TLS listeners and the
# port-80 redirect, so run it AFTER this file is in place:
#   certbot --nginx -d oddstradingview.com -d www.oddstradingview.com -d app.oddstradingview.com

# Next emits immutable, content-hashed asset names, so /_next/static can be
# cached hard. Everything else goes to the app so SSR stays fresh.
proxy_cache_path /var/cache/nginx/oddstrading levels=1:2 keys_zone=oddstrading:10m max_size=512m inactive=24h use_temp_path=off;

upstream oddstrading_landing {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream oddstrading_dashboard {
    server 127.0.0.1:3001;
    keepalive 32;
}

# --- Shared proxy behaviour -------------------------------------------------
# X-Forwarded-Proto is what lets Next build absolute https:// URLs behind the
# proxy; without it canonical tags and redirects come out as http.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- www → apex -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.oddstradingview.com;
    return 301 https://oddstradingview.com$request_uri;
}

# --- Landing: oddstradingview.com ------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name oddstradingview.com;

    # Uploads are tiny here (JSON only), but the default 1m is worth stating.
    client_max_body_size 2m;

    # Compress text payloads; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://oddstrading_landing;
        proxy_cache oddstrading;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://oddstrading_landing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Dashboard: app.oddstradingview.com ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.oddstradingview.com;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://oddstrading_dashboard;
        proxy_cache oddstrading;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://oddstrading_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
